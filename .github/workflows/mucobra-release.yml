# MU Volta fork: builds the patched Windows runtime and attaches it to a release of this fork.
#
# Push a tag "mucobra-v<upstream version>" (e.g. mucobra-v1.36.0) on the mucobra branch. The
# Windows job is copied from upstream's ci.yml build-windows job; keep it in sync when rebasing.
# The macOS runtime is built and uploaded to the same release by hand (see MUCOBRA.md).
name: MU Volta Release

on:
  push:
    tags: ['mucobra-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows Native Build (x64, Release, editor OFF)
    # By name, as upstream's ci.yml: another image brings another MSVC, and GitHub warns in every job while it moves
    # windows-latest to a new one.
    runs-on: windows-2025-vs2026
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Loads vcvars64.bat and passes every variable it changes on to the following steps, as Fork CI does
      # (ilammy/msvc-dev-cmd, used before, still runs on the deprecated Node.js 20).
      - name: Activate Visual Studio developer environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw "No Visual Studio installation with the x64 C++ tools found."
          }
          $vcvars = Join-Path $installation "VC\Auxiliary\Build\vcvars64.bat"
          # vcvars64.bat looks for vswhere.exe on PATH itself.
          $env:PATH = "$(Split-Path $vswhere);$env:PATH"
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if ($LASTEXITCODE -ne 0) {
            throw "vcvars64.bat failed."
          }

      - name: Assert MSVC developer environment
        shell: pwsh
        run: |
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $linker = (Get-Command link.exe -ErrorAction Stop).Source
          $compilerIdentity = (& $compiler /? 2>&1 | Out-String)
          $linkerIdentity = (& $linker /? 2>&1 | Out-String)

          Write-Host "cl.exe:   $compiler"
          Write-Host "link.exe: $linker"

          if ($compilerIdentity -notmatch 'Microsoft \(R\) C/C\+\+ Optimizing Compiler') {
            throw "cl.exe is not the Microsoft C/C++ compiler."
          }
          if ($compilerIdentity -notmatch 'for x64') {
            throw "cl.exe does not target x64."
          }
          if ($linkerIdentity -notmatch 'Microsoft \(R\) Incremental Linker') {
            throw "link.exe is not the Microsoft linker."
          }
          exit 0

      - name: Restore dependencies
        id: deps
        # The key names what picks these files: the root CMakeLists.txt declares the libraries, cmake/patches changes
        # their sources, and the ClientLibrary projects and the .NET SDK pick the NuGet packages (the SDK's version
        # picks those of its NativeAOT compiler). src/CMakeLists.txt is not part of it: it changes with every new
        # source file of the game. Only the release runs, the runs on main that build Windows, save it (Save
        # dependencies): a PR's own copy would serve that PR alone and push main's entries out of the 10 GB cache. One
        # kind of run saves each cache, so its newest entry, the one the prune job keeps, is always the newest commit's.
        uses: actions/cache/restore@v6
        with:
          path: |
            # Downloaded sources only: ninja recompiles restored *-build folders.
            out/build/windows-ci-x64-release/_deps/*-src
            out/build/windows-ci-x64-release/_deps/*-subbuild
            .nuget
          key: windows-x64-release-dep-sources-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('CMakeLists.txt', 'cmake/patches/**', 'cmake/ApplyGitPatch.cmake', 'cmake/UnpackArchive.cmake', 'ClientLibrary/**/*.csproj', 'ClientLibrary/**/*.props') }}
          restore-keys: windows-x64-release-dep-sources-

      - name: Identify vcpkg toolchain
        id: vcpkg
        shell: pwsh
        run: ./scripts/ci_vcpkg_cache_key.ps1

      - name: Restore vcpkg packages
        id: vcpkg_cache
        # Saved after the configure step, which builds what the archives lack, by the release runs only.
        uses: actions/cache/restore@v6
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-windows-x64-v2-${{ steps.vcpkg.outputs.identity }}-${{ hashFiles('vcpkg.json', 'toolchain-x64.cmake', 'cmake/triplets/**') }}
          restore-keys: vcpkg-windows-x64-v2-

      # Unlike ci.yml, no warning gate: a new compiler warning must not block a release.
      - name: Configure CMake
        run: >
          cmake --preset windows-x64
          -B out/build/windows-ci-x64-release
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${{ github.workspace }}/toolchain-x64.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/triplets
          -DVCPKG_INSTALLED_DIR=C:/vcpkg/installed
          -DVCPKG_MANIFEST_MODE=ON
          -DENABLE_EDITOR=OFF
          -DMU_ENABLE_SHADER_COMPILATION=ON
          -DGLSLANG_EXE=C:/vcpkg/installed/x64-windows/tools/glslang/glslangValidator.exe
          -DSPIRV_CROSS_EXE=C:/vcpkg/installed/x64-windows/tools/spirv-cross/spirv-cross.exe
          -DDXC_EXE=C:/vcpkg/installed/x64-windows/tools/directx-dxc/dxc.exe
          -DMU_COPY_RUNTIME_ASSETS=OFF
          -DBUILD_TESTING=ON

      - name: Assert configured MSVC compiler
        shell: pwsh
        run: |
          $buildDirectory = "out/build/windows-ci-x64-release"
          $compilerStates = @(
            Get-ChildItem `
              -Path "$buildDirectory/CMakeFiles/*/CMakeCXXCompiler.cmake" `
              -File
          )
          if ($compilerStates.Count -ne 1) {
            throw "Expected one top-level CMakeCXXCompiler.cmake; found $($compilerStates.Count)."
          }

          $compilerState = $compilerStates[0]
          $state = Get-Content -LiteralPath $compilerState.FullName -Raw
          if ($state -notmatch 'set\(CMAKE_CXX_COMPILER_ID "MSVC"\)') {
            throw "CMake did not configure the MSVC C++ compiler."
          }

          $compilerMatch = [regex]::Match(
            $state,
            'set\(CMAKE_CXX_COMPILER "([^"]+)"\)'
          )
          if (-not $compilerMatch.Success) {
            throw "CMake did not record the C++ compiler path."
          }

          $configuredCompiler = [IO.Path]::GetFullPath($compilerMatch.Groups[1].Value)
          $activeCompiler = [IO.Path]::GetFullPath(
            (Get-Command cl.exe -ErrorAction Stop).Source
          )
          Write-Host "CMake compiler ID: MSVC"
          Write-Host "CMake C++ compiler: $configuredCompiler"
          if (-not [StringComparer]::OrdinalIgnoreCase.Equals(
            $configuredCompiler,
            $activeCompiler
          )) {
            throw "CMake selected a compiler outside the active MSVC environment."
          }

      - name: Save vcpkg packages
        if: steps.vcpkg_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            ~/AppData/Local/vcpkg/archives
          key: ${{ steps.vcpkg_cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build out/build/windows-ci-x64-release --config Release

      - name: Save dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            # Downloaded sources only: ninja recompiles restored *-build folders.
            out/build/windows-ci-x64-release/_deps/*-src
            out/build/windows-ci-x64-release/_deps/*-subbuild
            .nuget
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Run tests
        run: >
          ctest --test-dir out/build/windows-ci-x64-release --build-config Release
          --output-on-failure
          --no-tests=error
          --label-exclude static

      - name: Stage MSVC redistributable runtime
        shell: pwsh
        run: |
          $runtimeDirectory = "out/build/windows-ci-x64-release/src/Release"
          if (-not (Test-Path -LiteralPath $runtimeDirectory -PathType Container)) {
            throw "Missing native runtime directory: $runtimeDirectory"
          }
          if ([string]::IsNullOrWhiteSpace($env:VCToolsRedistDir)) {
            throw "VCToolsRedistDir is missing from the active MSVC developer environment."
          }

          $redistArchitectureDirectory = Join-Path $env:VCToolsRedistDir "x64"
          $crtDirectories = @(
            Get-ChildItem -LiteralPath $redistArchitectureDirectory -Directory -Filter "Microsoft.VC*.CRT"
          )
          if ($crtDirectories.Count -ne 1) {
            throw "Expected one active Microsoft.VC*.CRT directory under $redistArchitectureDirectory; found $($crtDirectories.Count)."
          }

          $crtDlls = @(
            Get-ChildItem -LiteralPath $crtDirectories[0].FullName -File -Filter "*.dll" |
              Sort-Object Name
          )
          if ($crtDlls.Count -eq 0) {
            throw "Active MSVC CRT directory contains no redistributable DLLs."
          }
          Copy-Item -LiteralPath $crtDlls.FullName -Destination $runtimeDirectory -Force

      - name: Validate artifacts
        shell: pwsh
        run: |
          $runtimeDirectory = "out/build/windows-ci-x64-release/src/Release"
          $requiredFiles = @(
            "$runtimeDirectory/Main.exe",
            "$runtimeDirectory/MUnique.Client.Library.dll",
            "$runtimeDirectory/config.ini"
          )
          foreach ($path in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing required runtime file: $path"
            }
          }
          if (-not (Test-Path -LiteralPath "$runtimeDirectory/shaders" -PathType Container)) {
            throw "Missing required runtime directory: $runtimeDirectory/shaders"
          }
          foreach ($path in @("$runtimeDirectory/Data", "$runtimeDirectory/fonts")) {
            if (Test-Path -LiteralPath $path) {
              throw "Unexpected bundled game data: $path"
            }
          }

          $dumpbin = (Get-Command dumpbin.exe -ErrorAction Stop).Source
          $expectedMachinePattern = '^\s*8664 machine \(x64\)\s*$' # 8664 machine (x64)
          if ([string]::IsNullOrWhiteSpace($env:WINDIR)) {
            throw "WINDIR is required for target Windows OS DLL validation."
          }
          if ([Environment]::Is64BitProcess) {
            $targetSystemDirectory = Join-Path $env:WINDIR "System32"
          } else {
            $targetSystemDirectory = Join-Path $env:WINDIR "Sysnative"
          }
          $windowsOsDlls = @(
            "advapi32.dll"
            "avrt.dll"
            "bcrypt.dll"
            "cfgmgr32.dll"
            "combase.dll"
            "comctl32.dll"
            "comdlg32.dll"
            "crypt32.dll"
            "d3d12.dll"
            "dbghelp.dll"
            "dinput8.dll"
            "dnsapi.dll"
            "dwmapi.dll"
            "dxcore.dll"
            "dxgi.dll"
            "dxguid.dll"
            "gdi32.dll"
            "glu32.dll"
            "hid.dll"
            "imagehlp.dll"
            "imm32.dll"
            "iphlpapi.dll"
            "kernel32.dll"
            "mf.dll"
            "mfplat.dll"
            "mfreadwrite.dll"
            "mfsensorgroup.dll"
            "msvcrt.dll"
            "normaliz.dll"
            "ntdll.dll"
            "ole32.dll"
            "oleaut32.dll"
            "opengl32.dll"
            "powrprof.dll"
            "propsys.dll"
            "rpcrt4.dll"
            "sechost.dll"
            "secur32.dll"
            "setupapi.dll"
            "shell32.dll"
            "shcore.dll"
            "shlwapi.dll"
            "ucrtbase.dll"
            "uiautomationcore.dll"
            "urlmon.dll"
            "user32.dll"
            "usp10.dll"
            "uuid.dll"
            "version.dll"
            "vfw32.dll"
            "wininet.dll"
            "winmm.dll"
            "wintrust.dll"
            "wldap32.dll"
            "ws2_32.dll"
            "wtsapi32.dll"
          )
          $windowsOsDllAllowlist = @{}
          foreach ($windowsOsDll in $windowsOsDlls) {
            $windowsOsDllAllowlist[$windowsOsDll] = $true
          }

          $rootRuntimeFiles = @{}
          Get-ChildItem -LiteralPath $runtimeDirectory -Force -File |
            ForEach-Object { $rootRuntimeFiles[$_.Name] = $_.FullName }
          $runtimeBinaries = @(
            Get-ChildItem -LiteralPath $runtimeDirectory -Force -File -Recurse |
              Where-Object { $_.Extension -in @(".exe", ".dll") } |
              Sort-Object FullName
          )
          if ($runtimeBinaries.Count -eq 0) {
            throw "Runtime directory contains no PE files: $runtimeDirectory"
          }

          $missingImports = @()
          foreach ($binary in $runtimeBinaries) {
            $headers = @(& $dumpbin /headers $binary.FullName 2>&1)
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin /headers failed for $($binary.FullName) with exit code $LASTEXITCODE."
            }
            $machineMatches = @($headers | Select-String -Pattern $expectedMachinePattern)
            if ($machineMatches.Count -ne 1) {
              throw "Unexpected PE architecture for $($binary.FullName); expected x64."
            }

            $dependents = @(& $dumpbin /DEPENDENTS $binary.FullName 2>&1)
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin /DEPENDENTS failed for $($binary.FullName) with exit code $LASTEXITCODE."
            }
            $dependencySection = [regex]::Match(
              ($dependents -join "`n"),
              '(?ms)^[ \t]*Image has the following dependencies:[ \t]*\r?\n(?<body>.*?)(?=^[ \t]*Summary[ \t]*$)'
            )
            if (-not $dependencySection.Success) {
              throw "Could not parse dumpbin dependency heading for $($binary.FullName)."
            }
            $imports = @(
              [regex]::Matches(
                $dependencySection.Groups["body"].Value,
                '(?im)^[ \t]*(?<name>[^ \t\r\n]+\.dll)[ \t]*$'
              ) |
                ForEach-Object { $_.Groups["name"].Value } |
                Sort-Object -Unique
            )
            foreach ($importName in $imports) {
              $importFileName = [IO.Path]::GetFileName($importName)
              if (
                [IO.Path]::IsPathRooted($importName) -or
                $importName.Contains('/') -or
                $importName.Contains('\') -or
                -not [StringComparer]::Ordinal.Equals($importFileName, $importName)
              ) {
                $missingImports += "$($binary.FullName): invalid import name: $importName"
                continue
              }
              if ($importName -match '^(?:ucrtbased|(?:vcruntime|msvcp|concrt|vcomp)[0-9]+(?:_[a-z0-9_]+)?d)\.dll$') {
                $missingImports += "$($binary.FullName): debug CRT import in Release runtime: $importName"
                continue
              }
              if ($rootRuntimeFiles.ContainsKey($importName)) {
                continue
              }
              if ($importName -match '^(?:vcruntime|msvcp|concrt|vcomp)[0-9]+(?:_[a-z0-9_]+)?\.dll$') {
                $missingImports += "$($binary.FullName): VC runtime import must be staged root-local: $importName"
                continue
              }
              if ($importName -like "api-ms-win-*" -or $importName -like "ext-ms-win-*") {
                continue
              }
              if ($windowsOsDllAllowlist.ContainsKey($importName)) {
                $systemDllPath = Join-Path $targetSystemDirectory $importName
                if (Test-Path -LiteralPath $systemDllPath -PathType Leaf) {
                  continue
                }
                $missingImports += "$($binary.FullName): allowlisted Windows OS DLL missing from target system directory: $importName"
                continue
              }
              $missingImports += "$($binary.FullName): $importName"
            }
          }
          $missingImports = @($missingImports | Sort-Object -Unique)
          if ($missingImports.Count -ne 0) {
            throw "Missing runtime imports:`n$($missingImports -join "`n")"
          }

          # The shader list lives in cmake/ValidateShaderBlobs.cmake, which the
          # build already runs on its own shader output. Running it on the
          # runtime copy checks that every listed .spv, .msl and .dxil blob is
          # there and valid and that no unlisted one is.
          $shaderDirectory = (Resolve-Path -LiteralPath "$runtimeDirectory/shaders").Path.Replace('\', '/')
          cmake "-DMU_SHADER_BLOB_DIR=$shaderDirectory" -P cmake/ValidateShaderBlobs.cmake
          if ($LASTEXITCODE -ne 0) {
            throw "Runtime shaders do not match cmake/ValidateShaderBlobs.cmake (exit code $LASTEXITCODE)."
          }
          $otherShaderEntries = @(
            Get-ChildItem -LiteralPath $shaderDirectory -Force -Recurse |
              Where-Object { $_.PSIsContainer -or $_.Extension -notin @(".spv", ".msl", ".dxil") } |
              ForEach-Object { $_.FullName }
          )
          if ($otherShaderEntries.Count -ne 0) {
            throw "Unexpected entries in the runtime shader directory:`n$($otherShaderEntries -join "`n")"
          }

          Write-Host "Validated native x64 runtime directory: $runtimeDirectory"

      - name: Archive runtime
        run: tar -czf MuMain-windows-native-x64-release-editor-off-no-data.tar.gz -C out/build/windows-ci-x64-release/src/Release .

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: mu-client-windows-native-x64-release-editor-off-no-data-main
          path: MuMain-windows-native-x64-release-editor-off-no-data.tar.gz
          if-no-files-found: error

  release:
    name: Attach runtime to the release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/mucobra-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows runtime archive
        uses: actions/download-artifact@v4
        with:
          name: mu-client-windows-native-x64-release-editor-off-no-data-main
          path: .

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          asset=MuMain-windows-native-x64-release-editor-off-no-data.tar.gz
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "MU Volta ${TAG#mucobra-}" \
              --notes "Upstream ${TAG#mucobra-} with the MU Volta patches of the mucobra branch. Game data: the upstream release ${TAG#mucobra-}."
          fi
